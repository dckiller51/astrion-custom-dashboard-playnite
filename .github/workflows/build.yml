name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: dotnet build AstrionPlaynite.csproj -c Release -o out
      - name: Package (.pext)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item out/AstrionCustomDashboard.Playnite.dll, extension.yaml pack/
          Compress-Archive -Path pack/* -DestinationPath AstrionCustomDashboard.zip -Force
          Move-Item AstrionCustomDashboard.zip AstrionCustomDashboard.pext -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AstrionCustomDashboard.pext
          path: AstrionCustomDashboard.pext
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AstrionCustomDashboard.pext
